<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Rules</title>
    <style>
        :root { color-scheme: dark; --bg: #121212; --surface: #1e1e1e; --primary: #4caf50; --text: #e0e0e0; --muted: #a0a0a0; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        main { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; text-transform: uppercase; border-bottom: 3px solid #2e7d32; padding-bottom: 12px; }
        .card { padding: 16px; margin-top: 24px; background: var(--surface); border-left: 4px solid var(--primary); border-radius: 4px; }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <h1>Transport Rules</h1>
        <section class="card" aria-labelledby="transport-placeholder">
            <h2 id="transport-placeholder">Transport rules</h2>
            <p class="muted">This section is ready for transport rules to be added.</p>
        </section>
    </main>
</body>
</html>
